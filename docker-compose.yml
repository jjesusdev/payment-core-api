services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_core
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_core"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: payment-core-api:local
    environment:
      DB_URL: jdbc:postgresql://db:5432/payment_core
      DB_USERNAME: payment
      DB_PASSWORD: payment
      JWT_SECRET: dev-only-secret-change-me-0123456789abcdefghijklmnopqrstuvw
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy